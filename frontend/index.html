<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2a33" />
    <title>SystemKeeper</title>
    <style>
      html { background: #f4f6f7 }
      html.dark { background: #0c1116 }
    </style>
    <script>
      // Тема из настроек профиля (кешируется в localStorage, см. src/lib/theme.ts), до загрузки приложения — без мигания
      var theme = localStorage.getItem('systemkeeper_theme') || 'system'
      if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
