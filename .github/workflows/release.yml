# Релиз: git tag v1.2.3 && git push origin v1.2.3
# Собирает образ ghcr.io/<владелец>/systemkeeper (amd64 + arm64) и публикует релиз с файлами установки.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/systemkeeper" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Тег версии и latest
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/systemkeeper"
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)

  release:
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Релиз с файлами установки
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" deploy/compose.yaml deploy/install.sh deploy/updater.sh \
            --title "SystemKeeper $GITHUB_REF_NAME" --generate-notes $prerelease
